[versions]
# global versions
jdk = "21"

# dependency versions

# plugin versions
springBoot = "3.5.3"
springGradleDependencyManagement = "1.1.7"
kotlin = "2.1.21"
detekt = "1.23.8"
dokka = "2.0.0"
hypersistence = "3.10.1"
kotlinSerialization = "1.8.1"
jakarataValidation = "3.1.0"
jackson = "2.19.0"
java-jwt = "4.4.0"
jwks-rsa = "0.21.2"



[plugins]

[libraries]
# project dependencies

# test dependencies

# buildSrc dependencies (plugins)
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopenPlugin = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
kotlin-noargPlugin = { module = "org.jetbrains.kotlin:kotlin-noarg", version.ref = "kotlin" }
kotlin-serializationPlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kotlin-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinSerialization" }
springBoot-gradlePlugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }
spring-dependencyManagementPlugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "springGradleDependencyManagement" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
dokka-gradlePlugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
postgresql = { module = "org.postgresql:postgresql" }
liquibase = { module = "org.liquibase:liquibase-core" }
hypersistence = { module = "io.hypersistence:hypersistence-utils-hibernate-63", version.ref = "hypersistence" }
jakarta-validation = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarataValidation" }
jackson-kotlinmodule = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

# Detekt plugins
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
auth0-jwt = { module = "com.auth0:java-jwt", version.ref = "java-jwt" }
auth0-jwks = { module = "com.auth0:jwks-rsa", version.ref = "jwks-rsa" }


[bundles]
