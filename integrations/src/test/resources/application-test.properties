# Test configuration for Exotel integration
spring.profiles.active=test

# Database configuration for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Logging configuration for tests
logging.level.services.voice=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.test=DEBUG

# Exotel test configuration
exotel.test.account-sid=test_account_sid
exotel.test.auth-token=test_auth_token
exotel.test.subdomain=api.exotel.com
exotel.test.caller-id=09513886363
exotel.test.recording-enabled=true
exotel.test.max-call-duration=3600
exotel.test.timeout=30

# Test phone numbers
test.phone.from=7899515638
test.phone.to=8296687083
test.phone.caller-id=09513886363

# Test entity information
test.entity.name=Lead
test.entity.id=123
test.business.purpose=Test call

