name: PR Code Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
  JAVA_VERSION: '21'

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  coverage-analysis:
    name: Analyze Code Coverage for PR
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install XML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils bc

      - name: Run tests with coverage
        run: |
          ./gradlew test --no-daemon
          ./gradlew jacocoTestReport --no-daemon

      - name: Generate coverage report for changed files
        id: coverage
        run: |
          echo "📊 **CODE COVERAGE ANALYSIS** 📊" > coverage-output.txt
          echo "==================================" >> coverage-output.txt
          echo "" >> coverage-output.txt
          
          # Get changed files
          CHANGED_SOURCE_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | grep -E '\.(kt|java)$' | grep -v 'test' || true)
          CHANGED_TEST_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | grep -E '\.(kt|java)$' | grep 'test' || true)
          
          if [ -z "$CHANGED_SOURCE_FILES" ] && [ -z "$CHANGED_TEST_FILES" ]; then
            echo "✅ **No source code or test files changed**" >> coverage-output.txt
            echo "   No Kotlin/Java files were modified in this PR." >> coverage-output.txt
            echo "" >> coverage-output.txt
            echo "📈 **Overall Project Coverage:**" >> coverage-output.txt
            echo "   📁 Check coverage reports in build/reports/jacoco/" >> coverage-output.txt
          else
            echo "📝 **Changed Files:**" >> coverage-output.txt
          
            if [ -n "$CHANGED_SOURCE_FILES" ]; then
              echo "   🔧 **Source Code Files:**" >> coverage-output.txt
              for file in $CHANGED_SOURCE_FILES; do
                echo "      📄 $file" >> coverage-output.txt
              done
              echo "" >> coverage-output.txt
            fi
          
            if [ -n "$CHANGED_TEST_FILES" ]; then
              echo "   🧪 **Test Files:**" >> coverage-output.txt
              for file in $CHANGED_TEST_FILES; do
                echo "      📄 $file" >> coverage-output.txt
              done
              echo "" >> coverage-output.txt
            fi
          
            echo "" >> coverage-output.txt
          
            # Extract coverage data from JaCoCo XML reports
            JACOCO_REPORTS=$(find . -name "jacocoTestReport.xml" -type f)
            if [ -n "$JACOCO_REPORTS" ]; then
              echo "📈 **Coverage Summary:**" >> coverage-output.txt
              
              # Determine priority module for changes
              PRIORITY_MODULE=""
              if [ -n "$CHANGED_SOURCE_FILES" ]; then
                for file in $CHANGED_SOURCE_FILES; do
                  if [[ $file == features/* ]]; then
                    MODULE_NAME=$(echo "$file" | cut -d'/' -f2)
                    PRIORITY_MODULE="$MODULE_NAME"
                    break
                  fi
                done
              fi
          
              # Find priority report or use first available
              if [ -n "$PRIORITY_MODULE" ]; then
                FIRST_REPORT=$(echo "$JACOCO_REPORTS" | grep "/$PRIORITY_MODULE/" | head -1)
                if [ -n "$FIRST_REPORT" ]; then
                  echo "   🎯 **Priority Module:** $PRIORITY_MODULE" >> coverage-output.txt
                fi
              fi
              
              if [ -z "$FIRST_REPORT" ]; then
                FIRST_REPORT=$(echo "$JACOCO_REPORTS" | head -1)
              fi
          
              # Extract coverage values using XML parsing
              if command -v xmllint >/dev/null 2>&1; then
                LINE_COVERAGE=$(xmllint --xpath "string(/report/counter[@type='LINE']/@covered)" "$FIRST_REPORT" 2>/dev/null || echo "0")
                LINE_TOTAL=$(xmllint --xpath "string(/report/counter[@type='LINE']/@missed)" "$FIRST_REPORT" 2>/dev/null || echo "0")
                BRANCH_COVERAGE=$(xmllint --xpath "string(/report/counter[@type='BRANCH']/@covered)" "$FIRST_REPORT" 2>/dev/null || echo "0")
                BRANCH_TOTAL=$(xmllint --xpath "string(/report/counter[@type='BRANCH']/@missed)" "$FIRST_REPORT" 2>/dev/null || echo "0")
                
                # Fallback to alternative XPath if needed
                if [ "$LINE_COVERAGE" = "0" ] && [ "$LINE_TOTAL" = "0" ]; then
                  LINE_COVERAGE=$(xmllint --xpath "string(//counter[@type='LINE']/@covered)" "$FIRST_REPORT" 2>/dev/null || echo "0")
                  LINE_TOTAL=$(xmllint --xpath "string(//counter[@type='LINE']/@missed)" "$FIRST_REPORT" 2>/dev/null || echo "0")
                  BRANCH_COVERAGE=$(xmllint --xpath "string(//counter[@type='BRANCH']/@covered)" "$FIRST_REPORT" 2>/dev/null || echo "0")
                  BRANCH_TOTAL=$(xmllint --xpath "string(//counter[@type='BRANCH']/@missed)" "$FIRST_REPORT" 2>/dev/null || echo "0")
                fi
              else
                # Fallback to grep if xmllint not available
                LINE_COVERED=$(grep -o 'type="LINE" covered="[^"]*"' "$FIRST_REPORT" | head -1 | sed 's/.*covered="\([^"]*\)".*/\1/' || echo "0")
                LINE_MISSED=$(grep -o 'type="LINE" missed="[^"]*"' "$FIRST_REPORT" | head -1 | sed 's/.*missed="\([^"]*\)".*/\1/' || echo "0")
                BRANCH_COVERED=$(grep -o 'type="BRANCH" covered="[^"]*"' "$FIRST_REPORT" | head -1 | sed 's/.*covered="\([^"]*\)".*/\1/' || echo "0")
                BRANCH_MISSED=$(grep -o 'type="BRANCH" missed="[^"]*"' "$FIRST_REPORT" | head -1 | sed 's/.*missed="\([^"]*\)".*/\1/' || echo "0")
          
                LINE_COVERAGE=${LINE_COVERED:-0}
                LINE_TOTAL=${LINE_MISSED:-0}
                BRANCH_COVERAGE=${BRANCH_COVERED:-0}
                BRANCH_TOTAL=${BRANCH_MISSED:-0}
              fi
          
              # Calculate percentages
              if [ "$LINE_COVERAGE" -gt 0 ] || [ "$LINE_TOTAL" -gt 0 ]; then
                LINE_TOTAL_COUNT=$((LINE_COVERAGE + LINE_TOTAL))
                if [ "$LINE_TOTAL_COUNT" -gt 0 ]; then
                  LINE_PERCENT=$(echo "scale=1; $LINE_COVERAGE * 100 / $LINE_TOTAL_COUNT" | bc -l 2>/dev/null || echo "0")
                else
                  LINE_PERCENT="0"
                fi
              else
                LINE_PERCENT="0"
              fi
          
              if [ "$BRANCH_COVERAGE" -gt 0 ] || [ "$BRANCH_TOTAL" -gt 0 ]; then
                BRANCH_TOTAL_COUNT=$((BRANCH_COVERAGE + BRANCH_TOTAL))
                if [ "$BRANCH_TOTAL_COUNT" -gt 0 ]; then
                  BRANCH_PERCENT=$(echo "scale=1; $BRANCH_COVERAGE * 100 / $BRANCH_TOTAL_COUNT" | bc -l 2>/dev/null || echo "0")
                else
                  BRANCH_PERCENT="0"
                fi
              else
                BRANCH_PERCENT="0"
              fi
          
              # Ensure we have valid numbers
              LINE_PERCENT=${LINE_PERCENT:-0}
              BRANCH_PERCENT=${BRANCH_PERCENT:-0}
          
              # Check if we actually got valid coverage data
              if [ "$LINE_COVERAGE" = "0" ] && [ "$LINE_TOTAL" = "0" ] && [ "$BRANCH_COVERAGE" = "0" ] && [ "$BRANCH_TOTAL" = "0" ]; then
                echo "   ⚠️  **Warning: No coverage data found in XML report**" >> coverage-output.txt
                echo "   This might indicate no tests were executed or reports are empty." >> coverage-output.txt
                echo "" >> coverage-output.txt
              fi
          
              echo "   🎯 **Line Coverage:** ${LINE_PERCENT}%" >> coverage-output.txt
              echo "   🌿 **Branch Coverage:** ${BRANCH_PERCENT}%" >> coverage-output.txt
              echo "   📊 **Line Details:** ${LINE_COVERAGE} covered, ${LINE_TOTAL} missed" >> coverage-output.txt
              echo "   📊 **Branch Details:** ${BRANCH_COVERAGE} covered, ${BRANCH_TOTAL} missed" >> coverage-output.txt
              echo "" >> coverage-output.txt
          
              # Check against thresholds
              echo "📋 **Coverage Thresholds:**" >> coverage-output.txt
              if (( $(echo "$LINE_PERCENT >= 80" | bc -l 2>/dev/null || echo "0") )); then
                echo "   ✅ Line Coverage: ${LINE_PERCENT}% (≥ 80%)" >> coverage-output.txt
              else
                echo "   ❌ Line Coverage: ${LINE_PERCENT}% (< 80%)" >> coverage-output.txt
              fi
          
              if (( $(echo "$BRANCH_PERCENT >= 70" | bc -l 2>/dev/null || echo "0") )); then
                echo "   ✅ Branch Coverage: ${BRANCH_PERCENT}% (≥ 70%)" >> coverage-output.txt
              else
                echo "   ❌ Branch Coverage: ${BRANCH_PERCENT}% (< 70%)" >> coverage-output.txt
              fi
          
              echo "" >> coverage-output.txt
              echo "📊 **Coverage Reports:**" >> coverage-output.txt
              echo "$JACOCO_REPORTS" | while read -r report; do
                echo "   📄 XML Report: $report" >> coverage-output.txt
                HTML_REPORT=$(dirname "$report")/html/index.html
                if [ -f "$HTML_REPORT" ]; then
                  echo "   📁 HTML Report: $HTML_REPORT" >> coverage-output.txt
                fi
              done
            else
              echo "⚠️  **Coverage report not found**" >> coverage-output.txt
              echo "   JaCoCo report not generated. Check test execution." >> coverage-output.txt
            fi
          fi
          
          echo "" >> coverage-output.txt
          echo "💡 **Next Steps:**" >> coverage-output.txt
          echo "   1. Review coverage reports for detailed analysis" >> coverage-output.txt
          echo "   2. Add tests for uncovered code if needed" >> coverage-output.txt
          echo "   3. Ensure coverage meets minimum thresholds" >> coverage-output.txt
          
          cat coverage-output.txt

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-coverage-reports-${{ github.event.number }}
          path: |
            **/build/reports/jacoco/
          retention-days: 7

      - name: Comment PR with coverage summary
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let coverageComment = `## 📊 Code Coverage Analysis
            
            **PR #${context.issue.number}** - Coverage Summary
            
            `;
            
            try {
              const coverageFilePath = path.join(process.cwd(), 'coverage-output.txt');
            
              if (fs.existsSync(coverageFilePath)) {
                const coverageOutput = fs.readFileSync(coverageFilePath, 'utf8');
                coverageComment += coverageOutput;
              } else {
                coverageComment += `⚠️ **Coverage analysis failed**
            
                Error: coverage-output.txt file not found
            
                Please check the workflow logs for details.
                `;
              }
            } catch (error) {
              coverageComment += `⚠️ **Coverage analysis failed**
            
              Error: ${error.message}
            
              Please check the workflow logs for details.
              `;
            }
            
            coverageComment += `
            
            ---
            *This comment was automatically generated by the PR Coverage workflow*
            `;
            
            // Add comment to PR
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: coverageComment
              });
              console.log('Successfully added coverage comment to PR');
            } catch (error) {
              console.error('Failed to add comment to PR:', error.message);
            }
            
            // Update PR description with coverage badge
            try {
              const coverageFilePath = path.join(process.cwd(), 'coverage-output.txt');
            
              if (fs.existsSync(coverageFilePath)) {
                const coverageOutput = fs.readFileSync(coverageFilePath, 'utf8');
                const lineMatch = coverageOutput.match(/Line Coverage: ([\d.]+)%/);
                const branchMatch = coverageOutput.match(/Branch Coverage: ([\d.]+)%/);
            
                if (lineMatch && branchMatch) {
                  const lineCoverage = lineMatch[1];
                  const branchCoverage = branchMatch[1];
            
                  const getLineColor = (coverage) => {
                    const num = parseFloat(coverage);
                    if (num >= 80) return 'green';
                    if (num >= 60) return 'yellow';
                    return 'red';
                  };
            
                  const getBranchColor = (coverage) => {
                    const num = parseFloat(coverage);
                    if (num >= 70) return 'green';
                    if (num >= 50) return 'yellow';
                    return 'red';
                  };
            
                  const lineColor = getLineColor(lineCoverage);
                  const branchColor = getBranchColor(branchCoverage);
            
                  const coverageBadge = `![Coverage](https://img.shields.io/badge/coverage-${lineCoverage}%25-${lineColor}) ![Branch Coverage](https://img.shields.io/badge/branch-${branchCoverage}%25-${branchColor})`;
            
                  const pr = await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number
                  });
            
                  const currentDescription = pr.data.body || '';
                  const updatedDescription = coverageBadge + '\n\n' + currentDescription;
            
                  await github.rest.pulls.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                    body: updatedDescription
                  });
                  console.log('Successfully updated PR description with coverage badge');
                }
              }
            } catch (error) {
              console.log('Could not update PR description:', error.message);
            }
