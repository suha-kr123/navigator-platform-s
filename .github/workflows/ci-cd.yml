name: Build and Tag Docker Image

on:
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  IMAGE_NAME: navigator-platform

jobs:
  build-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 🛎️ Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for full Git history

    - name: ☕ Set up Java ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: temurin
        cache: gradle

    - name: 🔨 Build JAR
      run: |
        chmod +x ./gradlew
        ./gradlew clean build -x test
        ./gradlew bootJar

    - name: 🏷️ Generate Git tag
      id: create-tag
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        BRANCH=$(echo ${{ github.ref_name }} | sed 's/[^a-zA-Z0-9]/-/g')
        TAG_NAME="$BRANCH-$(date +%Y%m%d-%H%M%S)"
        git tag -a "$TAG_NAME" -m "Release from ${{ github.ref_name }} on $(date)"
        git push origin "$TAG_NAME"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

    - name: 🐳 Build Docker image
      run: |
        docker build -t ${{ env.IMAGE_NAME }}:${{ steps.create-tag.outputs.tag_name }} .
        
    - name: ✅ Done
      run: |
        echo "🎉 Docker image '${{ env.IMAGE_NAME }}:${{ steps.create-tag.outputs.tag_name }}' built successfully."
        echo "📦 Ready for deployment."
