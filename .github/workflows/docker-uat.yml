name: Build and Push Docker Image to UAT ECR

on:
  # Manual trigger 
  workflow_dispatch:
    inputs:
      docker_tag:
        description: 'Docker tag (leave empty to use git commit hash)'
        required: false
        type: string
  # Automatic trigger on push to these branches
  push:
    branches:
      - develop

# Environment variables (
env:
  JAVA_VERSION: '21'
  AWS_REGION: 'ap-south-1'
  AWS_ACCOUNT_ID: '600627336794'
  ECR_REPOSITORY: 'navigator-platform'
  # For OIDC: Replace with your IAM Role ARN after setting up OIDC
  AWS_ROLE_ARN: 'arn:aws:iam::600627336794:role/GitHubActions-ECR-Role'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30 
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication

    steps:
    
    - name: 🛎️ Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  

    # Step 2: Set up Java 
    - name: ☕ Set up Java ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: temurin
        cache: gradle  

    # Step 3: Make gradlew executable
    - name: 🔨 Grant execute permission for gradlew
      run: chmod +x ./gradlew

    # Step 4: Build Java application 
    - name: 🛠️ Run Gradle build
      run: |
        ./gradlew clean
        ./gradlew :main:build
      continue-on-error: false  

 
    - name: ✅ Verify JAR file exists
      run: |
        if [ ! -f "main/build/libs/main.jar" ]; then
          echo "❌ Error: main/build/libs/main.jar not found!"
          exit 1
        fi
        echo "✅ JAR file found: main/build/libs/main.jar"
        ls -lh main/build/libs/main.jar


    - name: 🏷️ Determine Docker tag
      id: tag
      run: |
        # Handle both workflow_dispatch (with input) and push events
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.docker_tag }}" ]; then
          TAG="${{ github.event.inputs.docker_tag }}"
        else
          TAG=$(git rev-parse --short HEAD)
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Using Docker tag: $TAG"

    # Step 6: Configure AWS credentials
    - name: 🔑 Configure AWS credentials using OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

  
    - name: 🔐 Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    
    - name: 🐳 Build Docker image
      run: |
        docker build --platform linux/amd64 \
          -t ${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }} \
          -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }} \
          .
      continue-on-error: false  

    # Step 9: Push Docker image to ECR 
    - name: 📤 Push Docker image to ECR
      run: |
        docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
      continue-on-error: false  

    - name: ✅ Success
      run: |
        echo "✅ Successfully built and pushed ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}"
        echo "📦 Image is now available in AWS ECR for UAT deployment"

