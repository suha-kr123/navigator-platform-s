spring.messages.encoding=UTF-8
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/navigator-platform}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.liquibase.change-log=classpath:/db/master/db.changelog-master.xml
spring.liquibase.enabled=true
spring.cache.type=redis
spring.data.redis.host=${REDIS_URL:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.ssl.enabled=true

# Document Storage Configuration
document.storage.provider=${DOCUMENT_STORAGE_PROVIDER:LOCAL}
document.storage.signed-url.expiration-seconds=${DOCUMENT_SIGNED_URL_EXPIRATION:300}
document.storage.fallback.enabled=${DOCUMENT_STORAGE_FALLBACK_ENABLED:true}

# AWS S3 Configuration
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:}
aws.s3.use-iam-roles=${AWS_S3_USE_IAM_ROLES:false}

# Local Storage Configuration
local.storage.base-path=${LOCAL_STORAGE_BASE_PATH:/tmp/documents}

# Management endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

#CORS configuration
cors.origins=${CORS_ORIGINS:*}