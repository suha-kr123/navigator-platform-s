spring.datasource.url=jdbc:postgresql://localhost:5432/navigator-platform-dev
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase configuration (required for dev profile)
spring.liquibase.change-log=classpath:/db/master/db.changelog-master.xml
spring.liquibase.enabled=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=false

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Document Module Configuration
document.storage.provider=LOCAL
document.storage.signed-url.expiration-seconds=300
document.storage.fallback.enabled=true
local.storage.base-path=/tmp/documents
# Multipart file upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=5MB

# Management endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=navigator-platform
management.metrics.tags.environment=dev

# Logging
logging.level.com.nivasafinance.features.document=DEBUG
logging.level.com.nivasafinance.features.lead.service=INFO

#CORS configuration
cors.origins=${CORS_ORIGINS:*}

# WebSocket configuration
websocket.endpoint=/ws
websocket.allowed-origins=*
websocket.enable-sockjs=true
websocket.topic-prefix=/topic
websocket.queue-prefix=/queue
websocket.app-prefix=/app

# Call notification configuration
call.notification.max-per-user=5

