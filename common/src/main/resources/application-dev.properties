spring.datasource.url=jdbc:postgresql://localhost:5432/navigator-platform-dev
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=false

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Document Module Configuration
document.storage.provider=LOCAL
document.storage.signed-url.expiration-seconds=${DOCUMENT_SIGNED_URL_EXPIRATION:300}
document.storage.fallback.enabled=true
local.storage.base-path=${LOCAL_STORAGE_PATH:/tmp/documents}
# Multipart file upload configuration
spring.servlet.multipart.enabled=${MULTIPART_ENABLED:true}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}
spring.servlet.multipart.file-size-threshold=${MULTIPART_FILE_SIZE_THRESHOLD:5MB}

# AWS S3 Configuration
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:navigator-storage-a}
aws.s3.region=${AWS_S3_REGION:ap-south-1}
aws.s3.use-iam-roles=${AWS_S3_USE_IAM_ROLES:false}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# Logging
logging.level.com.nivasafinance.features.document=DEBUG