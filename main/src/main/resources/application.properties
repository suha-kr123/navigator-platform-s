spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Load bulk-operations config (bulkoperations.csv.* etc.)
spring.config.import=optional:classpath:application-bulk-operations.properties
spring.jpa.properties.hibernate.types.jackson.object.mapper=com.nivasafinance.common.configs.HypersistenceObjectMapperSupplier

# Fix JSONB wrapper issue with Spring Boot 3.5.3 + Hypersistence
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Disable Hibernate 6 native JSONB support to use Hypersistence JsonType instead
# This prevents the {"type":"jsonb","value":"...","null":false} wrapper issue
spring.jpa.properties.hibernate.type.preferred_json_type=JSON


firebase.service-account.path=${FIREBASE_SERVICE_ACCOUNT_PATH:}