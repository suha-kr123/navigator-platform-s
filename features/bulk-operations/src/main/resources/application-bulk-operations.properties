# Bulk Operations Configuration

# Batch processing
bulk.operations.batch-size=100
bulk.operations.max-concurrent-operations-per-user=5
bulk.operations.max-file-size-mb=10

# Idempotency
bulk.operations.duplicate-upload-window-minutes=30

# Processing
bulk.operations.max-concurrent-processing=2
bulk.operations.max-retries=3
bulk.operations.retry-delay-seconds=5

# Timeout (in hours)
bulk.operations.validation-timeout-hours=2
bulk.operations.processing-timeout-hours=24

# File storage
bulk.operations.report-retention-days=7
bulk.operations.temp-file-retention-days=30

# Thread pool
bulk.operations.async-executor.core-pool-size=5
bulk.operations.async-executor.max-pool-size=10
bulk.operations.async-executor.queue-capacity=100

# 10MB
bulkoperations.csv.max-file-size=10485760
# Max data rows per file (prevents unbounded memory use)
bulkoperations.csv.max-rows=50000

